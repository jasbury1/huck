name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install swiftformat swiftlint
      - name: Lint
        run: make lint

  test:
    name: Build & unit test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # The runner image installs each Xcode as /Applications/Xcode_<version>.app.
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: Test
        run: make test DESTINATION='platform=iOS Simulator,OS=latest,name=iPhone 17'
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/DerivedData/Logs/Test

  ui-test:
    name: UI test
    runs-on: xcode-27
    # UI tests replay the recorded responses in Huck/Fixtures.bundle, so they
    # need no network access and see the same Hacker News on every run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: UI test
        run: make test-ui DESTINATION='platform=iOS Simulator,OS=latest,name=iPhone 17'
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: build/DerivedData/Logs/Test
